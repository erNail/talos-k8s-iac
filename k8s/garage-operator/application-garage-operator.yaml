apiVersion: "argoproj.io/v1alpha1"
kind: "Application"
metadata:
  name: "garage-operator"
  namespace: "argocd"
spec:
  project: "default"
  sources:
    - repoURL: "https://github.com/erNail/talos-k8s-iac"
      targetRevision: "feat/restart"
      path: "k8s/garage-operator"
      ref: "values"
      directory:
        exclude: "application-*.yaml"
    - repoURL: "ghcr.io/rajsinghtech/charts"
      chart: "garage-operator"
      targetRevision: "0.3.8"
      helm:
        releaseName: "garage-operator"
        valueFiles:
          - "$values/k8s/garage-operator/values-garage-operator.yaml"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: "garage-operator"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - "CreateNamespace=true"
