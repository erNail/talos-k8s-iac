---
apiVersion: "argoproj.io/v1alpha1"
kind: "Application"
metadata:
  name: "kyverno"
  namespace: "argocd"
spec:
  project: "default"
  sources:
    - repoURL: "https://github.com/erNail/talos-k8s-iac"
      targetRevision: "feat/restart"
      path: "k8s/kyverno"
      ref: "values"
      directory:
        exclude: "application-*.yaml"
    - repoURL: "https://kyverno.github.io/kyverno/"
      chart: "kyverno"
      targetRevision: "3.7.1"
      helm:
        releaseName: "kyverno"
        valueFiles:
          - "$values/k8s/kyverno/values-kyverno.yaml"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: "kyverno"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - "CreateNamespace=true"
      - "ServerSideApply=true"
