---
apiVersion: "cilium.io/v2"
kind: "CiliumNetworkPolicy"
metadata:
  name: "argocd-repo-server"
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: "argocd"
      app.kubernetes.io/name: "argocd-repo-server"
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: "kube-prometheus-stack"
            app.kubernetes.io/name: "prometheus"
      toPorts:
        - ports:
            - port: "8084"
              protocol: "TCP"
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: "argocd"
            app.kubernetes.io/name: "argocd-application-controller"
      toPorts:
        - ports:
            - port: "8081"
              protocol: "TCP"
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: "argocd"
            app.kubernetes.io/name: "argocd-server"
      toPorts:
        - ports:
            - port: "8081"
              protocol: "TCP"
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: "kube-system"
            k8s:k8s-app: "kube-dns"
      toPorts:
        - ports:
            - port: "53"
              protocol: "ANY"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: "argocd"
            app.kubernetes.io/name: "valkey"
      toPorts:
        - ports:
            - port: "6379"
              protocol: "TCP"
    - toEntities:
        - "world"
---
apiVersion: "cilium.io/v2"
kind: "CiliumNetworkPolicy"
metadata:
  name: "argocd-application-controller"
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: "argocd"
      app.kubernetes.io/name: "argocd-application-controller"
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: "kube-prometheus-stack"
            app.kubernetes.io/name: "prometheus"
      toPorts:
        - ports:
            - port: "8082"
              protocol: "TCP"
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: "argocd"
            app.kubernetes.io/name: "valkey"
      toPorts:
        - ports:
            - port: "8082"
              protocol: "TCP"
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: "kube-system"
            k8s:k8s-app: "kube-dns"
      toPorts:
        - ports:
            - port: "53"
              protocol: "ANY"
    - toEntities:
        - "kube-apiserver"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: "argocd"
            app.kubernetes.io/name: "argocd-repo-server"
          toPorts:
            - ports:
                - port: "8081"
                  protocol: "TCP"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: "argocd"
            app.kubernetes.io/name: "valkey"
      toPorts:
        - ports:
            - port: "6379"
              protocol: "TCP"
