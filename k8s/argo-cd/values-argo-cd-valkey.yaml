---
architecture: "replication"
replicaCount: 3

resources:
  requests:
    cpu: "20m"
    memory: "128Mi"
  limits:
    memory: "128Mi"

initContainer:
  resources:
    requests:
      cpu: "10m"
      memory: "64Mi"
    limits:
      memory: "64Mi"
      cpu: null

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: "app.kubernetes.io/name"
                operator: "In"
                values:
                  - "valkey"
          topologyKey: "kubernetes.io/hostname"

auth:
  enabled: true
  existingSecret: "argo-cd-valkey-credentials"
  existingSecretPasswordKey: "redis-password"

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
  resources:
    requests:
      cpu: "10m"
      memory: "64Mi"
    limits:
      memory: "64Mi"
