---
apiVersion: "argoproj.io/v1alpha1"
kind: "Application"
metadata:
  name: "argo-cd"
  namespace: "argocd"
spec:
  project: "default"
  sources:
    - repoURL: "https://github.com/erNail/talos-k8s-iac"
      targetRevision: "feat/restart"
      path: "k8s/argo-cd"
      ref: "values"
      directory:
        exclude: "application-*.yaml"
    - repoURL: "https://argoproj.github.io/argo-helm"
      chart: "argo-cd"
      targetRevision: "9.5.0"
      helm:
        releaseName: "argo-cd"
        valueFiles:
          - "$values/k8s/argo-cd/values-argo-cd.yaml"
    - repoURL: "https://valkey.io/valkey-helm/"
      chart: "valkey"
      targetRevision: "0.9.4"
      helm:
        releaseName: "argo-cd-valkey"
        valueFiles:
          - "$values/k8s/argo-cd/values-argo-cd-valkey.yaml"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: "argocd"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - "CreateNamespace=true"
