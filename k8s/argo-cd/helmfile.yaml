---
repositories:
  - name: "argo"
    url: "https://argoproj.github.io/argo-helm"
  - name: "valkey"
    url: "https://valkey.io/valkey-helm"

releases:
  - name: "argo-cd"
    namespace: "argocd"
    chart: "argo/argo-cd"
    version: "9.5.0"
    missingFileHandler: "Error"
    values:
      - "./values-argo-cd.yaml"
  - name: "argo-cd-valkey"
    namespace: "argocd"
    chart: "valkey/valkey"
    version: "0.9.4"
    missingFileHandler: "Error"
    values:
      - "./values-argo-cd-valkey.yaml"
