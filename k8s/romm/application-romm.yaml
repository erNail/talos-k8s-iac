---
apiVersion: "argoproj.io/v1alpha1"
kind: "Application"
metadata:
  name: "romm"
  namespace: "argocd"
spec:
  project: "default"
  sources:
    - repoURL: "https://github.com/erNail/talos-k8s-iac"
      targetRevision: "feat/cleanup"
      path: "k8s/romm"
      ref: "values"
    - repoURL: "ghcr.io/ernail/charts"
      chart: "romm"
      targetRevision: "1.0.1"
      helm:
        releaseName: "romm"
        valueFiles:
          - "$values/k8s/romm/values-romm.yaml"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: "romm"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - "CreateNamespace=true"
