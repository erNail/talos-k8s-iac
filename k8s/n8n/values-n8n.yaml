ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "dns01-cloudflare-cluster-issuer-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: "n8n.nailforge.dev"
      paths:
        - "/"
  tls:
    - hosts:
        -  "n8n.nailforge.dev"
      secretName: "n8n-tls"

main:
  persistence:
    enabled: true
    storageClass: "longhorn"
    size: "8Gi"