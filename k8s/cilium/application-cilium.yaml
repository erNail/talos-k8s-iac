---
apiVersion: "argoproj.io/v1alpha1"
kind: "Application"
metadata:
  name: "cilium"
  namespace: "argocd"
spec:
  project: "default"
  sources:
    - repoURL: "https://github.com/erNail/talos-k8s-iac"
      targetRevision: "feat/cleanup"
      path: "k8s/cilium"
      ref: "values"
    - repoURL: "https://helm.cilium.io/"
      chart: "cilium"
      targetRevision: "1.18.4"
      helm:
        releaseName: "cilium"
        valueFiles:
          - "$values/k8s/cilium/values-cilium.yaml"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: "kube-system"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - "CreateNamespace=true"
