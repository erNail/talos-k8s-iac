persistence:
  storageClass: "longhorn"
  size: "8Gi"

auth:
  existingSecret: "loki-minio-root-user"

provisioning:
  enabled: true
  buckets:
    - name: "loki-chunks"
    - name: "loki-ruler"
    - name: "loki-admin"

ingress:
  enabled: true
  ingressClassName: "nginx"
  hostname: "minio.loki.nailforge.dev"
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "dns01-cloudflare-cluster-issuer-prod"
  tls: true

metrics:
  enabled: true
  serviceMonitor:
    enabled: true