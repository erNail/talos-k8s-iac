deploymentMode: "SingleBinary"

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: "tsdb"
        object_store: "s3"
        schema: "v13"
        index:
          prefix: "loki_index_"
          period: "24h"
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 48h
  ruler:
    enable_api: true
  storage:
    type: s3
    bucketNames:
      chunks: "loki-chunks"
      ruler: "loki-ruler"
      admin: "loki-admin"
    s3:
      endpoint: "garage.garage-operator.svc.cluster.local:3900"
      accessKeyId: "${S3_ACCESS_KEY_ID}"
      secretAccessKey: "${S3_SECRET_ACCESS_KEY}"
      region: "garage"
      insecure: true
      s3ForcePathStyle: true

singleBinary:
  replicas: 1
  persistence:
    storageClass: "longhorn"
    size: "16Gi"
  extraArgs:
    - "--config.expand-env=true"
    - "--print-config-stderr"
  extraEnv:
    - name: "S3_ACCESS_KEY_ID"
      valueFrom:
        secretKeyRef:
          name: "loki-garage-key"
          key: "access-key-id"
    - name: "S3_SECRET_ACCESS_KEY"
      valueFrom:
        secretKeyRef:
          name: "loki-garage-key"
          key: "secret-access-key"

gateway:
  ingress:
    enabled: true
    ingressClassName: "nginx"
    annotations:
      kubernetes.io/ingress.class: "nginx"
      cert-manager.io/cluster-issuer: "dns01-cloudflare-cluster-issuer-prod"
    tls:
      - hosts:
          - "loki.nailforge.dev"
        secretName: "loki-tls"
    hosts:
      - host: "loki.nailforge.dev"
        paths:
          - path: "/"
            pathType: "Prefix"

monitoring:
  serviceMonitor:
    enabled: true

backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

ingester:
  replicas: 0

querier:
  replicas: 0

queryFrontend:
  replicas: 0

queryScheduler:
  replicas: 0

distributor:
  replicas: 0

compactor:
  replicas: 0

indexGateway:
  replicas: 0

bloomCompactor:
  replicas: 0

bloomGateway:
  replicas: 0
