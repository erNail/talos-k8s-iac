---
apiVersion: "argoproj.io/v1alpha1"
kind: "Application"
metadata:
  name: "minecraft"
  namespace: "argocd"
spec:
  project: "default"
  sources:
    - repoURL: "https://github.com/erNail/talos-k8s-iac"
      targetRevision: "feat/cleanup"
      path: "k8s/minecraft"
      ref: "values"
    - repoURL: "https://itzg.github.io/minecraft-server-charts/"
      chart: "minecraft"
      targetRevision: "5.0.0"
      helm:
        releaseName: "minecraft"
        valueFiles:
          - "$values/k8s/minecraft/values-minecraft.yaml"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: "minecraft"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - "CreateNamespace=true"
