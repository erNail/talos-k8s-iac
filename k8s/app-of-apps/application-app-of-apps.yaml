---
apiVersion: "argoproj.io/v1alpha1"
kind: "Application"
metadata:
  name: "app-of-apps"
  namespace: "argocd"
spec:
  project: "default"
  sources:
    - repoURL: "https://github.com/erNail/talos-k8s-iac"
      targetRevision: "feat/restart"
      path: "k8s"
      directory:
        recurse: true
        include: "**/application-*.yaml"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: "argocd"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - "CreateNamespace=true"
      - "ServerSideApply=true"
